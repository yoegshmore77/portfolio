<!DOCTYPE html>
<html>

<head>
    <title>Markerless AR Tennis</title>
    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>

    <!-- TensorFlow.js & COCO-SSD -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

    <!-- OpenCV.js — shim must exist before async load completes -->
    <script>
        window.cvReady = false;
        function onOpenCvReady() {
            console.log('[Boot] OpenCV loaded');
            window.cvReady = true;
            document.dispatchEvent(new Event('cvReady'));
        }
    </script>
    <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady();"
        type="text/javascript"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- PHASE 1: SCANNER VIDEO FEED (Raw HTML Video) -->
    <!-- We use this video element for detection -->
    <video id="webcam" autoplay playsinline muted width="640" height="480"
        style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1;"></video>

    <!-- Debug Canvas -->
    <canvas id="debug-canvas" width="640" height="480"
        style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 2; pointer-events: none; opacity: 1.0;"></canvas>

    <!-- UI LAYER -->
    <div id="ui-layer">
        <!-- Scanner UI -->
        <div id="scanner-overlay">
            <div class="scanner-box">
                <div class="scanner-line"></div>
            </div>
            <div id="status-msg">POINT AT A RECTANGULAR OBJECT</div>
        </div>

        <!-- Game UI -->
        <div id="game-ui" style="display: none;">
            <div style="font-size: 20px; font-weight: bold; color: white; text-shadow: 1px 1px 2px black;">
                GOALS: <span id="score">0</span> <br>
                SHOTS: <span id="attempts">0</span>/5
            </div>
            <div id="game-over-msg" style="display:none; font-size: 30px; color: yellow; margin-top: 20px;">GAME OVER
            </div>
        </div>
    </div>

    <!-- PHASE 2: AR SCENE (Initially Hidden) -->
    <!-- We hide the scene until we detect the object -->
    <a-scene id="ar-scene" visible="false" embedded vr-mode-ui="enabled: false">

        <!-- COURT CONTAINER (Spawns in front of camera) -->
        <a-entity id="court-container" position="0 -1.5 -4">

            <!-- Floor/Grass -->
            <a-plane position="0 0 0" rotation="-90 0 0" width="10" height="10" color="#3c8f3c"></a-plane>

            <!-- DETECTED OBJECT HIGHLIGHT -->
            <a-box id="detected-box" position="0 0 0" depth="0.1"
                material="style: wireframe; color: yellow; opacity: 0.8"></a-box>

            <!-- Penalty Spot -->
            <a-circle position="0 0.01 2" rotation="-90 0 0" radius="0.1" color="white"></a-circle>

            <!-- GOAL POST -->
            <a-entity id="goal-post" position="0 0 -4">
                <!-- Left Post -->
                <a-box position="-1.5 1 0" width="0.1" height="2" depth="0.1" color="white"></a-box>
                <!-- Right Post -->
                <a-box position="1.5 1 0" width="0.1" height="2" depth="0.1" color="white"></a-box>
                <!-- Crossbar -->
                <a-box position="0 2 0" width="3.1" height="0.1" depth="0.1" color="white"></a-box>
                <!-- Net (Visual) -->
                <a-plane position="0 1 -0.1" width="3" height="2" color="white" opacity="0.2"></a-plane>
            </a-entity>

            <!-- BALL -->
            <a-sphere id="ball" position="0 0.1 2" radius="0.15" color="white"
                src="https://raw.githubusercontent.com/aframevr/sample-assets/master/assets/images/space/earth_atmos_4096.jpg"></a-sphere>

            <!-- GOALKEEPER -->
            <a-box id="goalkeeper" position="0 1 -3.5" width="0.8" height="1.6" depth="0.2" color="red"></a-box>

        </a-entity>

        <!-- CAMERA -->
        <a-camera position="0 1.6 0" look-controls="enabled: true"></a-camera>

        <!-- LIGHTING -->
        <a-light type="ambient" color="#fff"></a-light>
        <a-light type="directional" position="-1 1 1"></a-light>

    </a-scene>

    <script src="b_detector.js"></script>
    <script src="game.js"></script>
</body>

</html>
